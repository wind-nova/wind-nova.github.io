<?xml version="1.0" encoding="UTF-8"?>
<!-- icon-cat.svg — 页脚睡觉的小猫 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" role="img" aria-label="蜷缩睡觉的小猫">
  <!-- 尾巴 -->
  <path d="M96 52c10-2 14-10 10-16" fill="none" stroke="#C9BDB2" stroke-width="4"
    stroke-linecap="round" />

  <!-- 身体 -->
  <ellipse cx="60" cy="52" rx="38" ry="22" fill="#F3EDE4" stroke="#E0D7CB" stroke-width="2" />

  <!-- 耳朵 -->
  <path d="M30 38l-2-14 14 7z" fill="#F3EDE4" stroke="#E0D7CB" stroke-width="2" stroke-linejoin="round" />
  <path d="M52 34l2-14 12 10z" fill="#F3EDE4" stroke="#E0D7CB" stroke-width="2" stroke-linejoin="round" />

  <!-- 头 -->
  <circle cx="40" cy="48" r="18" fill="#F8F3EB" stroke="#E0D7CB" stroke-width="2" />

  <!-- 闭着的眼睛 -->
  <path d="M33 47c2 2.4 5 2.4 7 0" fill="none" stroke="#8A8580" stroke-width="2.2" stroke-linecap="round" />
  <path d="M46 47c2 2.4 5 2.4 7 0" fill="none" stroke="#8A8580" stroke-width="2.2" stroke-linecap="round" />

  <!-- 鼻子与胡须 -->
  <path d="M42.6 52.5h1.6l-.8 1.4z" fill="#F2B5C4" />
  <path d="M28 52h6M28 56h6" stroke="#D9CFC2" stroke-width="1.4" stroke-linecap="round" />
  <path d="M58 52h-6M58 56h-6" stroke="#D9CFC2" stroke-width="1.4" stroke-linecap="round" />

  <!-- 腮红 -->
  <ellipse cx="30" cy="55" rx="4" ry="2.6" fill="#F2B5C4" opacity="0.5" />
  <ellipse cx="51" cy="55" rx="4" ry="2.6" fill="#F2B5C4" opacity="0.5" />

  <!-- 睡觉的小 Z -->
  <text x="84" y="24" font-family="Georgia, serif" font-size="14" fill="#A8A29C">z</text>
  <text x="96" y="14" font-family="Georgia, serif" font-size="10" fill="#C4BDB4">z</text>
</svg>
